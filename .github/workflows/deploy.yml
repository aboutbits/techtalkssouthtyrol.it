name: Deploy

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22
  VERCEL_ORGANIZATION_ID: team_e2WfHoRuw9BQVW7oYmMSKRJ6
  VERCEL_PROJECT_ID: prj_7YQv3cdkQRMMtF5nhPdNXWbeI7f3
  APP_VERSION: ${{ github.sha }}

jobs:
  test:
    name: Tests
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.ref }}-deploy
      cancel-in-progress: false
    needs:
      - test
    steps:
      - uses: actions/checkout@v5
      - uses: aboutbits/github-actions-node/setup-and-install@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          registry-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      - uses: aboutbits/github-actions-vercel/deploy@v1
        env:
          BASE_URL: https://techtalkssouthtyrol.it
          PLAUSIBLE_DOMAIN: techtalkssouthtyrol.it
          ALLOW_SEARCH_ENGINE_INDEXING: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-organization-id: ${{ env.VERCEL_ORGANIZATION_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          build-arguments: --prod
          deploy-arguments: --prod

  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - deploy
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      - uses: aboutbits/github-actions-base/git-setup@v2
      - uses: aboutbits/github-actions-base/git-create-or-update-tag@v2
        with:
          tag-name: 'prod-version'
          message: 'Deployed to Prod'
